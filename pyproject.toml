[tool.poetry]
name = "taskq-docs"
version = "0.1.0"
description = "MkDocs documentation environment for taskq"
authors = ["Denis Dubovitskiy <...>"]
readme = "../README.md"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
mkdocs-material = "9.7.7"
mkdocs-static-i18n = "1.3.1"
pymdown-extensions = "11.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
